<!DOCTYPE html>
<html lang="en" class="dark" data-theme="obsidian">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description"
    content="EPFTrack — Employees Provident Fund (KWSP) Institutional Portfolio Dashboard. Real-time Malaysian equity holdings, transactions, and performance analytics.">
  <title>EPFTrack — Institutional Portfolio Dashboard</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "var(--bg-page)",
            "surface": "var(--bg-surface)",
            "surface-container-lowest": "var(--bg-page)",
            "surface-container-low": "var(--bg-input)",
            "surface-container": "var(--bg-card)",
            "surface-container-high": "var(--bg-card-hover)",
            "surface-container-highest": "var(--bg-panel-raised)",
            "primary": "var(--accent)",
            "primary-hover": "var(--accent-hover)",
            "primary-container": "var(--accent-secondary)",
            "primary-fixed": "var(--text-accent)",
            "primary-fixed-dim": "var(--text-accent)",
            "on-primary": "#ffffff",
            "on-surface": "var(--text-primary)",
            "on-surface-variant": "var(--text-secondary)",
            "outline": "var(--text-muted)",
            "outline-variant": "var(--border-base)"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "2xl": "1.25rem",
            "full": "9999px"
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Global Design System & Custom Themes -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-page text-on-surface font-sans antialiased min-h-screen relative selection:bg-rose-500/30 selection:text-white">

  <!-- Ambient Dynamic Smoke Mesh (Luxury White Moonlight Glow) -->
  <div class="smoke-container" aria-hidden="true">
    <div class="smoke-blob smoke-blob-1"></div>
    <div class="smoke-blob smoke-blob-2"></div>
    <div class="smoke-blob smoke-blob-3"></div>
  </div>

  <!-- Adaptive Root Container (Dynamic Slot for Set A Desktop / Set B Mobile) -->
  <div id="app-root" class="w-full min-h-screen">
    <!-- Initial Loading Placeholder -->
    <div class="w-full h-screen flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <img src="assets/logo.png" alt="Loading" class="h-14 w-14 object-contain animate-pulse">
        <span class="text-xs font-semibold tracking-wider text-outline uppercase">LOADING...</span>
      </div>
    </div>
  </div>

  <!-- Global Data Asset -->
  <script src="data.js"></script>

  <!-- Universal Master Application Script -->
  <script src="app.js"></script>
</body>

</html>
