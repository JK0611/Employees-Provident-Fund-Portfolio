  <meta name="title" content="EPF Tracker — Institutional Malaysian Equity Portfolio & Analytics Dashboard">

  <meta name="author" content="JK0611">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#08090e">
  <meta name="application-name" content="EPF Tracker">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">

  <!-- Open Graph / Facebook / WhatsApp / Telegram / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EPF Tracker">
  <meta property="og:url" content="https://epf-tracker.vercel.app/">
  <meta property="og:title" content="EPF Tracker — Institutional Malaysian Equity Portfolio Dashboard">
  <meta property="og:description" content="Explore RM 228B+ of EPF (KWSP) Malaysian domestic equity positions, top holdings, sector weightings, capital activity, and real-time Bursa filings.">
  <meta property="og:image" content="assets/logo.png">
  <meta property="og:locale" content="en_MY">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EPF Tracker — Institutional Portfolio Dashboard">
  <meta name="twitter:description" content="Track RM 228B+ of Employees Provident Fund (KWSP) Malaysian equity investments with institutional-grade analytics.">
  <meta name="twitter:image" content="assets/logo.png">

      "Sector & Company Allocation Donut Visualizations",
      "Net Capital Inflow/Outflow Volume Bar Charts",
      "Bursa Malaysia Substantial Shareholder Notices Feed"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "var(--bg-page)",
            "surface": "var(--bg-surface)",
            "surface-container-lowest": "var(--bg-page)",
            "surface-container-low": "var(--bg-input)",
            "surface-container": "var(--bg-card)",

            "surface-container-highest": "var(--bg-panel-raised)",

            "primary-fixed": "var(--text-accent)",
            "primary-fixed-dim": "var(--text-accent)",
            "on-primary": "#ffffff",
            "on-surface": "var(--text-primary)",
            "on-surface-variant": "var(--text-secondary)",

          borderRadius: {

  <link rel="stylesheet" href="style.css">

<body class="bg-page text-on-surface font-sans antialiased min-h-screen relative selection:bg-rose-500/30 selection:text-white">

  <!-- Ambient Dynamic Smoke Mesh (Luxury White Moonlight Glow) -->
  <div class="smoke-container" aria-hidden="true">
    <div class="smoke-blob smoke-blob-1"></div>
    <div class="smoke-blob smoke-blob-2"></div>
    <div class="smoke-blob smoke-blob-3"></div>
  </div>

  <!-- Adaptive Root Container (Dynamic Slot for Set A Desktop / Set B Mobile) -->
  <div id="app-root" class="w-full min-h-screen">
    <!-- Initial Loading Placeholder -->
    <div class="w-full h-screen flex items-center justify-center">
      <div class="flex flex-col items-center gap-3">
        <img src="assets/logo.png" alt="Loading" class="h-14 w-14 object-contain animate-pulse">
        <span class="text-xs font-semibold tracking-wider text-outline uppercase">LOADING...</span>
      </div>
    </div>
  </div>

  <!-- Global Data Asset -->
  <script src="data.js"></script>

  <!-- Universal Master Application Script -->
  <script src="app.js"></script>
</body>

</html>
